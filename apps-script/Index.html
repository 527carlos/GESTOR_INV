<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISERA Portal - PrintTech Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #080c14;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
      margin: 0;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    input[type="range"].accent-sky-500 { accent-color: #0ea5e9; }
    input[type="file"]::file-selector-button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // -----------------------------------------------------------------------
    // Constants
    // -----------------------------------------------------------------------
    var PRINTER_MODELS = [
      'Plotter Z-Series X1', 'LaserJet Pro M501', 'Indico 12000 Press', 'Latex 365 Printer',
      'Eco-Jet Desktop v3', 'Plotter Master 8000', 'Industrial Line P-Series', 'Thermal-Z'
    ];
    var NAV_ITEMS = [
      { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
      { id: 'library', label: 'Instructivos', icon: 'book-open' },
      { id: 'training', label: 'Capacitación', icon: 'graduation-cap' },
      { id: 'cases', label: 'Gestión de Casos', icon: 'sliders-horizontal' },
      { id: 'content', label: 'Contenido', icon: 'folder-cog' },
      { id: 'settings', label: 'Sheets & Roles', icon: 'settings' }
    ];
    var LIBRARY_CATEGORIES = ['Todos', 'Inyección de Tinta', 'Láser', 'Gran Formato', 'Térmicas'];
    var TOKEN_STORAGE_KEY = 'isera_token';

    // -----------------------------------------------------------------------
    // App state
    // -----------------------------------------------------------------------
    var APP = {
      session: { token: null, user: null },
      data: null,
      activeTab: 'dashboard',
      isSyncing: false,
      editingCase: null,       // {isNew:true} or a full case object
      formError: '',
      isSubmitting: false,
      inspectingLogsCase: null,
      library: { selectedType: 'Todos', resourceType: 'Manual', search: '', downloadingManual: null },
      training: { selectedCourseId: null, sessionRequested: false, playingVideoId: null },
      content: {
        editingManual: null, manualFormError: '', manualUploadMode: 'file', pendingManualFile: null,
        editingVideo: null, videoFormError: '', videoUploadMode: 'file', pendingVideoFile: null,
        isSubmitting: false
      },
      usersMgmt: { editingUser: null, formError: '', isSubmitting: false }
    };

    // -----------------------------------------------------------------------
    // Utilities
    // -----------------------------------------------------------------------
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function gsRun(fnName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            if (err && typeof err.message === 'string' && err.message.indexOf('AUTH:') === 0) {
              forceLogout(err.message.replace('AUTH:', '').trim());
            }
            reject(err);
          });
        runner[fnName].apply(runner, args);
      });
    }

    function errorMessageOf_(err) {
      if (!err) return 'Error desconocido.';
      if (typeof err === 'string') return err;
      return err.message || String(err);
    }

    function getActiveUser() {
      if (APP.data && APP.data.currentUser) return APP.data.currentUser;
      return APP.session.user;
    }

    function relTimeIso(iso) {
      var ms = new Date(iso).getTime();
      var diffMin = Math.round((Date.now() - ms) / 60000);
      if (diffMin < 1) return 'Hace momentos';
      if (diffMin < 60) return 'Hace ' + diffMin + 'm';
      if (diffMin < 1440) return 'Hace ' + Math.floor(diffMin / 60) + 'h';
      return new Date(iso).toLocaleDateString();
    }

    function byId(id) { return document.getElementById(id); }
    function val(id) { var el = byId(id); return el ? el.value : ''; }
    function checked(id) { var el = byId(id); return el ? el.checked : false; }

    function refreshIcons() { if (window.lucide) lucide.createIcons(); }

    function readFileAsBase64_(file, onDone) {
      var reader = new FileReader();
      reader.onload = function () {
        var base64Data = String(reader.result).split(',')[1];
        onDone({ base64Data: base64Data, filename: file.name, mimeType: file.type || 'application/octet-stream' });
      };
      reader.readAsDataURL(file);
    }

    function extractYouTubeId_(url) {
      var m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{6,})/);
      return m ? m[1] : null;
    }

    // -----------------------------------------------------------------------
    // Boot, session and polling
    // -----------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', function () {
      var savedToken = null;
      try { savedToken = sessionStorage.getItem(TOKEN_STORAGE_KEY); } catch (e) { /* almacenamiento no disponible */ }
      if (savedToken) {
        APP.session.token = savedToken;
        renderAll();
        loadData(true);
      } else {
        renderAll();
      }
      setInterval(function () {
        if (APP.session.token) loadData(false);
      }, 9000);
    });

    function loadData(showSpinner) {
      if (!APP.session.token) { renderAll(); return; }
      if (showSpinner) { APP.isSyncing = true; }
      gsRun('getInitialData', APP.session.token).then(function (data) {
        APP.data = data;
        APP.session.user = data.currentUser;
        if (showSpinner) {
          setTimeout(function () { APP.isSyncing = false; renderAll(); }, 500);
        } else if (!APP.editingCase && !APP.inspectingLogsCase && !APP.training.selectedCourseId &&
          !APP.content.editingManual && !APP.content.editingVideo && !APP.usersMgmt.editingUser) {
          renderAll();
        }
      }).catch(function (err) {
        console.error('Error cargando datos:', err);
        APP.isSyncing = false;
        if (!(err && err.message && err.message.indexOf('AUTH:') === 0)) {
          renderLoadError(err);
        }
      });
    }

    function handleSyncNow() {
      loadData(true);
    }

    function retryLoad() {
      byId('root').innerHTML = loadingScreenHtml();
      refreshIcons();
      loadData(true);
    }

    function forceLogout(message) {
      try { sessionStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) { /* almacenamiento no disponible */ }
      APP.session = { token: null, user: null };
      APP.data = null;
      renderAll();
      if (message) {
        setTimeout(function () {
          var el = byId('loginError');
          if (el) { el.textContent = message; el.classList.remove('hidden'); }
        }, 50);
      }
    }

    function handleLogout() {
      gsRun('logout', APP.session.token).catch(function () {});
      try { sessionStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) { /* almacenamiento no disponible */ }
      APP.session = { token: null, user: null };
      APP.data = null;
      renderAll();
    }

    function submitLogin(ev) {
      ev.preventDefault();
      var username = val('loginUsername');
      var password = val('loginPassword');
      var btn = byId('loginSubmitBtn');
      var errEl = byId('loginError');
      if (errEl) errEl.classList.add('hidden');
      if (btn) btn.disabled = true;
      gsRun('login', username, password).then(function (res) {
        if (btn) btn.disabled = false;
        if (res.success) {
          APP.session.token = res.token;
          APP.session.user = res.user;
          try { sessionStorage.setItem(TOKEN_STORAGE_KEY, res.token); } catch (e) { /* almacenamiento no disponible */ }
          loadData(true);
        } else if (errEl) {
          errEl.textContent = res.error;
          errEl.classList.remove('hidden');
        }
      }).catch(function (err) {
        if (btn) btn.disabled = false;
        if (errEl) { errEl.textContent = errorMessageOf_(err); errEl.classList.remove('hidden'); }
      });
    }

    function loginScreenHtml() {
      return '' +
        '<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">' +
          '<div class="w-full max-w-sm bg-slate-900/60 border border-slate-800 rounded-3xl shadow-2xl p-8 space-y-6">' +
            '<div class="flex flex-col items-center gap-3 text-center">' +
              '<div class="w-14 h-14 bg-sky-500/10 flex items-center justify-center rounded-2xl border border-sky-500/20 text-sky-400"><i data-lucide="database" class="w-7 h-7"></i></div>' +
              '<div><h1 class="font-bold text-xl text-white tracking-tight">ISERA Portal</h1><p class="text-xs text-slate-400 font-semibold tracking-wider uppercase mt-0.5">PrintTech Systems</p></div>' +
            '</div>' +
            '<form onsubmit="submitLogin(event)" class="space-y-4">' +
              '<div id="loginError" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-2.5 rounded-xl text-xs font-semibold"></div>' +
              '<div class="space-y-1"><label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Usuario</label>' +
                '<input id="loginUsername" type="text" autocomplete="username" placeholder="usuario" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 px-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-sky-500" required></div>' +
              '<div class="space-y-1"><label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Contraseña</label>' +
                '<input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 px-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-sky-500" required></div>' +
              '<button id="loginSubmitBtn" type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"><i data-lucide="log-in" class="w-4 h-4"></i>Iniciar sesión</button>' +
            '</form>' +
            '<p class="text-[10px] text-slate-500 text-center leading-relaxed">Acceso restringido al personal técnico de PrintTech. Contacta a tu administrador si no tienes credenciales.</p>' +
          '</div>' +
        '</div>';
    }

    function renderLoadError(err) {
      var root = byId('root');
      root.innerHTML = '' +
        '<div class="min-h-screen bg-slate-950 flex flex-col items-center justify-center gap-4 text-slate-200 p-6">' +
          '<i data-lucide="alert-triangle" class="w-10 h-10 text-rose-400"></i>' +
          '<p class="font-bold text-sm tracking-wide uppercase text-center">No se pudo cargar la base de datos</p>' +
          '<p class="text-xs text-slate-400 max-w-md text-center font-mono bg-slate-900 border border-slate-800 rounded-xl p-3">' + esc(errorMessageOf_(err)) + '</p>' +
          '<p class="text-[11px] text-slate-500 max-w-md text-center">Revisa que la función <b>initializeSpreadsheet</b> se haya ejecutado al menos una vez desde el editor de Apps Script y que la cuenta con la que se desplegó tenga acceso a la hoja de cálculo.</p>' +
          '<button onclick="retryLoad()" class="mt-2 bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 cursor-pointer"><i data-lucide="refresh-cw" class="w-4 h-4"></i>Reintentar</button>' +
        '</div>';
      refreshIcons();
    }

    // -----------------------------------------------------------------------
    // Master render
    // -----------------------------------------------------------------------
    function renderAll() {
      var root = byId('root');
      if (!APP.session.token) {
        root.innerHTML = loginScreenHtml();
        refreshIcons();
        return;
      }
      if (!APP.data) {
        root.innerHTML = loadingScreenHtml();
        refreshIcons();
        return;
      }
      try {
        root.innerHTML = layoutHtml();
        renderMainContent();
        renderModals();
        refreshIcons();
      } catch (err) {
        console.error('Error al renderizar la interfaz:', err);
        renderLoadError(err);
      }
    }

    function setActiveTab(tab) {
      APP.activeTab = tab;
      renderAll();
    }

    function loadingScreenHtml() {
      return '' +
        '<div class="min-h-screen bg-slate-950 flex flex-col items-center justify-center gap-4 text-slate-200">' +
          '<i data-lucide="loader-2" class="w-10 h-10 animate-spin text-sky-400"></i>' +
          '<p class="font-bold text-sm tracking-wide uppercase">Cargando base de datos PrintTech...</p>' +
        '</div>';
    }

    // -----------------------------------------------------------------------
    // Layout: sidebar, header, mobile nav, footer
    // -----------------------------------------------------------------------
    function layoutHtml() {
      return '' +
        '<div class="min-h-screen bg-slate-950 flex text-slate-200">' +
          sidebarHtml() +
          '<div class="flex-1 flex flex-col md:pl-64 min-w-0">' +
            headerHtml() +
            mobileSidebarHtml() +
            '<main id="main-content" class="flex-grow p-4 md:p-8 animate-fade-in mb-16 md:mb-0"></main>' +
            mobileBottomNavHtml() +
            footerHtml() +
          '</div>' +
        '</div>' +
        '<div id="modals-root"></div>' +
        '<div id="toast-root"></div>';
    }

    function navButtonsHtml(extraClass) {
      return NAV_ITEMS.map(function (item) {
        var isActive = APP.activeTab === item.id;
        return '' +
          '<button onclick="setActiveTab(\'' + item.id + '\')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ' + extraClass + ' ' +
            (isActive ? 'bg-sky-500/10 text-sky-400 shadow-sm font-semibold border border-sky-500/10' : 'text-slate-400 hover:bg-slate-800/50 hover:text-white') + '">' +
            '<i data-lucide="' + item.icon + '" class="w-5 h-5 ' + (isActive ? 'text-sky-400' : '') + '"></i>' +
            item.label +
          '</button>';
      }).join('');
    }

    function sidebarHtml() {
      var d = APP.data;
      var activeUser = getActiveUser();

      return '' +
        '<aside class="hidden md:flex flex-col w-64 bg-slate-900/40 backdrop-blur border-r border-slate-800 fixed h-screen z-30">' +
          '<div class="p-6 border-b border-slate-800/80">' +
            '<div class="flex items-center gap-3">' +
              '<div class="w-10 h-10 bg-sky-500/10 flex items-center justify-center rounded-xl border border-sky-500/20 text-sky-400 shrink-0 shadow-sm"><i data-lucide="database" class="w-5 h-5"></i></div>' +
              '<div><div class="flex items-center gap-1.5"><h2 class="font-bold text-base leading-tight text-white tracking-tight">ISERA Portal</h2>' +
              '<span class="text-[9px] font-mono font-bold bg-sky-500/15 text-sky-400 px-1.5 py-0.2 rounded border border-sky-500/20">PRO</span></div>' +
              '<p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase mt-0.5">PrintTech Systems</p></div>' +
            '</div>' +
            '<div class="mt-3 flex items-center justify-between text-[10px] text-slate-500 font-mono">' +
              '<span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>v5.0.0-gas</span>' +
            '</div>' +
          '</div>' +
          '<nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar">' + navButtonsHtml('') + '</nav>' +
          '<div class="p-4 mx-3 mb-4 bg-slate-900/50 border border-slate-800 rounded-2xl">' +
            '<div class="flex items-center justify-between mb-2">' +
              '<span class="text-[11px] font-bold text-slate-400 tracking-wide uppercase flex items-center gap-1.5"><i data-lucide="database-zap" class="w-3.5 h-3.5 text-sky-400"></i> Sheets Sync</span>' +
              '<span class="flex h-2 w-2 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>' +
            '</div>' +
            '<p class="text-[11px] text-slate-400 truncate" title="' + esc(d.googleSheetsSettings.spreadsheetId) + '">ID: ...' + esc(String(d.googleSheetsSettings.spreadsheetId).slice(-8)) + '</p>' +
            '<div class="mt-3 flex items-center justify-between">' +
              '<span class="text-[10px] text-slate-500 font-medium">Auto-Sync Activo</span>' +
              '<button onclick="handleSyncNow()" class="text-[10px] text-sky-400 flex items-center gap-1 hover:underline font-bold"><i data-lucide="refresh-cw" class="w-3 h-3 ' + (APP.isSyncing ? 'animate-spin' : '') + '"></i>Sincronizar</button>' +
            '</div>' +
          '</div>' +
          '<div class="p-4 border-t border-slate-800 bg-slate-900/50">' +
            '<div class="relative">' +
              '<button onclick="byId(\'userDropdownPopup\').classList.toggle(\'hidden\')" class="w-full flex items-center gap-3 p-1.5 rounded-xl hover:bg-slate-800/50 transition-colors text-left">' +
                '<img src="' + esc(activeUser.avatar) + '" class="w-10 h-10 rounded-full object-cover border-2 border-sky-400">' +
                '<div class="flex-1 min-w-0"><p class="text-xs font-bold truncate text-slate-200">' + esc(activeUser.name) + '</p><p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">' + esc(activeUser.role) + '</p></div>' +
                '<i data-lucide="chevron-up" class="w-4 h-4 text-sky-400 shrink-0"></i>' +
              '</button>' +
              '<div id="userDropdownPopup" class="hidden absolute bottom-full left-0 w-full mb-2 bg-slate-900 border border-slate-800 shadow-xl z-50 py-2">' +
                '<button onclick="byId(\'userDropdownPopup\').classList.add(\'hidden\'); setActiveTab(\'settings\')" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-left text-slate-300 hover:bg-slate-800/50"><i data-lucide="user-cog" class="w-4 h-4"></i>Mi Cuenta</button>' +
                '<button onclick="handleLogout()" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-left text-rose-400 hover:bg-slate-800/50"><i data-lucide="log-out" class="w-4 h-4"></i>Cerrar sesión</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</aside>';
    }

    function headerHtml() {
      var d = APP.data;
      var activeUser = getActiveUser();
      var logs = d.googleSheetsSettings.syncLogs.slice(0, 10).map(function (log) {
        var levelClass = log.level === 'success' ? 'text-emerald-400' : log.level === 'error' ? 'text-rose-400' : 'text-sky-400';
        return '' +
          '<div class="text-xs pb-2 border-b border-slate-800 last:border-0">' +
            '<div class="flex justify-between text-[9px] text-slate-400 mb-0.5"><span>' + new Date(log.timestamp).toLocaleTimeString() + '</span><span class="capitalize font-semibold ' + levelClass + '">' + esc(log.level) + '</span></div>' +
            '<p class="text-slate-200 leading-tight">' + esc(log.message) + '</p>' +
          '</div>';
      }).join('') || '<p class="text-xs text-slate-500 py-2">Sin eventos recientes.</p>';

      return '' +
        '<header class="h-16 bg-slate-950/70 backdrop-blur border-b border-slate-800 sticky top-0 z-20 flex items-center justify-between px-4 md:px-8 shadow-sm">' +
          '<div class="flex items-center gap-4 flex-1">' +
            '<button onclick="byId(\'mobileSidebarOverlay\').classList.remove(\'hidden\')" class="md:hidden p-1.5 hover:bg-slate-800 rounded-xl text-slate-200"><i data-lucide="menu" class="w-6 h-6"></i></button>' +
            '<div class="relative w-full max-w-md hidden sm:block">' +
              '<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i data-lucide="search" class="w-4 h-4"></i></span>' +
              '<input type="text" placeholder="Buscar manuales, casos técnicos o herramientas..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl py-1.5 pl-9 pr-4 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-sky-500 focus:border-transparent transition-all">' +
            '</div>' +
            '<div class="md:hidden"><h1 class="font-bold text-white text-base">ISERA Portal</h1></div>' +
          '</div>' +
          '<div class="flex items-center gap-3">' +
            '<div class="hidden lg:flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-full px-3 py-1 text-xs text-sky-400 font-medium"><i data-lucide="database-zap" class="w-3.5 h-3.5"></i><span>G-Sheets Activo</span></div>' +
            '<div class="relative">' +
              '<button onclick="byId(\'notifPopup\').classList.toggle(\'hidden\')" class="p-2 text-slate-400 hover:bg-slate-800 rounded-full transition-colors relative">' +
                '<i data-lucide="bell" class="w-5 h-5"></i><span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-slate-950"></span>' +
              '</button>' +
              '<div id="notifPopup" class="hidden absolute right-0 mt-2 w-80 bg-slate-900/95 backdrop-blur rounded-2xl border border-slate-800 shadow-xl z-50 py-3 px-4">' +
                '<div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-2"><h3 class="font-bold text-sm text-white">Logs de Sincronización</h3><span class="text-[9px] font-bold text-sky-400 px-2 py-0.5 bg-slate-800 rounded-full">Real-time</span></div>' +
                '<div class="max-h-60 overflow-y-auto space-y-2 custom-scrollbar">' + logs + '</div>' +
                '<button onclick="setActiveTab(\'settings\')" class="w-full mt-2 text-center text-xs text-sky-400 hover:underline font-bold">Ver consola de Sheets</button>' +
              '</div>' +
            '</div>' +
            '<div class="h-6 w-px bg-slate-800"></div>' +
            '<div class="flex items-center gap-2">' +
              '<img src="' + esc(activeUser.avatar) + '" class="w-8 h-8 rounded-full object-cover border border-sky-400 md:border-0">' +
              '<div class="hidden lg:block text-left leading-none"><p class="text-xs font-bold text-slate-200">' + esc(activeUser.name) + '</p><p class="text-[9px] text-slate-400 font-bold tracking-wider uppercase mt-0.5">' + esc(activeUser.level) + '</p></div>' +
            '</div>' +
          '</div>' +
        '</header>';
    }

    function mobileSidebarHtml() {
      return '' +

    function caseStatusBadge(status) {
      var cls = status === 'Abierto' ? 'bg-rose-500/10 text-rose-400' :

        status === 'Esperando Pieza' ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400';
      var pulse = status === 'Abierto' ? '<span class="w-1.5 h-1.5 bg-rose-400 rounded-full animate-ping"></span>' : '';
      return '<span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase inline-flex items-center gap-1.5 ' + cls + '">' + pulse + esc(status) + '</span>';
    }

    function renderCasesResults() {
      if (!APP.data) return;
      var q = (val('caseSearchInput') || '').toLowerCase();
      var statusFilter = val('caseStatusFilter') || 'Todos los Estados';
      var priorityFilter = val('casePriorityFilter') || 'Todas las Prioridades';

      var filtered = APP.data.cases.filter(function (c) {
        var matchesSearch = c.id.toLowerCase().indexOf(q) !== -1 || c.client.toLowerCase().indexOf(q) !== -1 ||
          c.model.toLowerCase().indexOf(q) !== -1 || (c.description && c.description.toLowerCase().indexOf(q) !== -1);
        var matchesStatus = statusFilter === 'Todos los Estados' || c.status === statusFilter;
        var matchesPriority = priorityFilter === 'Todas las Prioridades' || c.priority === priorityFilter;
        return matchesSearch && matchesStatus && matchesPriority;
      });

      var rows = filtered.length === 0
        ? '<tr><td colspan="6" class="px-5 py-10 text-center text-slate-500 font-medium bg-slate-900/10">No se encontraron casos activos que coincidan con los filtros seleccionados.</td></tr>'
        : filtered.map(function (c) {
          var activeUser = getActiveUser();
          var canDelete = activeUser.role === 'Admin Tech';
          var priorityClass = c.priority === 'Crítica' ? 'text-rose-400' : c.priority === 'Alta' ? 'text-amber-400' : 'text-sky-400';
          return '' +
            '<tr class="hover:bg-slate-800/30 transition-colors group">' +
              '<td class="px-5 py-4 font-mono font-bold text-sky-400 text-sm whitespace-nowrap">' + esc(c.id) + '</td>' +
              '<td class="px-5 py-4 font-semibold text-white text-sm"><div><p class="line-clamp-1">' + esc(c.client) + '</p><p class="text-[10px] text-slate-400 font-medium mt-0.5">Por: ' + esc(c.reporter) + '</p></div></td>' +
              '<td class="px-5 py-4 font-medium text-slate-300 text-xs whitespace-nowrap">' + esc(c.model) + '</td>' +
              '<td class="px-5 py-4 whitespace-nowrap">' + caseStatusBadge(c.status) + '</td>' +
              '<td class="px-5 py-4 whitespace-nowrap"><span class="font-bold text-[11px] ' + priorityClass + '">' + esc(c.priority) + '</span></td>' +
              '<td class="px-5 py-4 text-right whitespace-nowrap"><div class="flex justify-end gap-1.5">' +

    function confirmDeleteCase(id) {
      var activeUser = getActiveUser();
      if (activeUser.role !== 'Admin Tech') {
        alert('Acceso Restringido: Solo administradores (Admin Tech) pueden eliminar de forma permanente registros de la hoja de cálculo de Google Sheets.');
        return;
      }
      if (confirm('¿Está seguro de que desea eliminar permanentemente el caso ' + id + '? Esta acción quitará la fila de la hoja de cálculo de Google Sheets de forma instantánea.')) {
        gsRun('deleteCase', APP.session.token, id).then(function (res) {
          if (!res.success) alert(res.error || 'No se pudo eliminar el caso.');
          loadData(false);
        });
      }
    }

    function submitCaseForm(ev) {
      ev.preventDefault();
      var id = val('caseFormId').trim();
      var client = val('caseFormClient');
      var model = val('caseFormModel');
      var priority = val('caseFormPriority');
      var status = val('caseFormStatus');
      var description = val('caseFormDescription');
      var rules = APP.data.validationRules;

      var errors = {};
      var idRegex;
      try { idRegex = new RegExp(rules.caseIdRegex); } catch (e) { idRegex = /^#[0-9]{5}-[A-Z]$/; }
      if (!id) errors.id = 'El código del caso es obligatorio.';
      else if (!idRegex.test(id)) errors.id = 'Formato incorrecto. Debe cumplir con ' + rules.caseIdRegex + ' (Ej: #77412-A).';
      if (!client.trim()) errors.client = 'El nombre del cliente es obligatorio.';
      else if (client.trim().length < rules.minClientLength) errors.client = 'Mínimo de caracteres: ' + rules.minClientLength + '.';
      if (!rules.allowSpecialCharsInClient) {
        var specialChars = /[^a-zA-Z0-9\sÁÉÍÓÚáéíóúÑñ.,-]/;
        if (specialChars.test(client)) errors.client = 'No se permiten caracteres especiales o símbolos.';
      }
      if (rules.requireModelSelection && !model) errors.model = 'Selecciona un modelo técnico de impresora.';
      if (rules.requireDescription && (!description || description.trim().length < 10)) errors.description = 'Descripción obligatoria (mínimo 10 caracteres).';

      if (Object.keys(errors).length > 0) {
        APP.formError = Object.values(errors)[0];
        renderModals();
        return;
      }

      APP.isSubmitting = true;
      renderModals();
      var activeUser = getActiveUser();
      var payload = {
        id: id, client: client, model: model, status: status, priority: priority, description: description,
        reporter: (APP.editingCase && !APP.editingCase.isNew) ? APP.editingCase.reporter : activeUser.name
      };
      gsRun('saveCase', APP.session.token, payload).then(function (res) {
        APP.isSubmitting = false;
        if (res.success) {
          APP.editingCase = null;
          APP.formError = '';
          renderModals();
          loadData(false);
        } else {
          APP.formError = res.error || 'Ocurrió un error al guardar el caso.';
          renderModals();
        }
      }).catch(function () {
        APP.isSubmitting = false;
        APP.formError = 'Error de comunicación con el servidor.';
        renderModals();
      });
    }

    function renderLibraryResults() {
      if (!APP.data) return;
      var q = (APP.library.search || '').toLowerCase();
      var type = APP.library.selectedType;
      var resourceType = APP.library.resourceType;
      var filtered = APP.data.manuals.filter(function (m) {
        var matchesResource = m.resourceType === resourceType;
        var matchesType = type === 'Todos' || m.type === type;
        var matchesSearch = m.title.toLowerCase().indexOf(q) !== -1 || m.description.toLowerCase().indexOf(q) !== -1;
        return matchesResource && matchesType && matchesSearch;
      });

      var grid = byId('libraryGrid');
      if (!grid) return;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 font-medium bg-slate-900/40 rounded-3xl border border-slate-800">No hay recursos disponibles que coincidan con la búsqueda técnica.</div>';
        refreshIcons();
        return;
      }

      grid.innerHTML = filtered.map(function (m) {
        var diffBadge = m.difficulty === 'HARD' ? 'bg-rose-500 text-white' : m.difficulty === 'MEDIUM' ? 'bg-amber-500 text-white' : 'bg-emerald-500 text-white';
        return '' +
          '<div class="group bg-slate-900/40 border border-slate-800 rounded-3xl overflow-hidden hover:shadow-lg transition-all flex flex-col h-full">' +
            '<div class="h-44 overflow-hidden relative border-b border-slate-800 bg-slate-950">' +
              '<img src="' + esc(m.image) + '" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 filter saturate-[0.8]">' +
              '<span class="absolute top-3 right-3 px-2.5 py-1 rounded-xl text-[10px] font-bold uppercase tracking-wider shadow-sm ' + diffBadge + '">' + esc(m.difficulty) + '</span>' +

            '<div class="p-5 flex flex-col gap-4 flex-grow justify-between">' +
              '<div class="space-y-1.5"><span class="text-[10px] text-sky-400 font-bold uppercase tracking-widest bg-slate-800 px-2 py-0.5 rounded">' + esc(m.type) + '</span>' +
              '<h3 class="font-bold text-base text-white group-hover:text-sky-400 transition-colors line-clamp-1 leading-snug">' + esc(m.title) + '</h3>' +
              '<p class="text-xs text-slate-400 leading-relaxed line-clamp-2">' + esc(m.description) + '</p></div>' +

    function handleDownloadManual(manualId) {
      gsRun('downloadManual', APP.session.token, manualId).then(function (res) {

          setTimeout(function () { APP.library.downloadingManual = null; renderToast(); }, 2500);

    function submitManualForm(ev) {
      ev.preventDefault();
      var m = APP.content.editingManual;
      var title = val('manualFormTitle').trim();
      if (!title) { APP.content.manualFormError = 'El título es obligatorio.'; renderModals(); return; }
      var payload = {
        id: m.id || undefined,
        title: title,
        description: val('manualFormDescription'),
        type: val('manualFormType') || 'General',
        difficulty: val('manualFormDifficulty'),
        resourceType: val('manualFormResourceType')
      };

      APP.content.isSubmitting = true;
      APP.content.manualFormError = '';
      renderModals();

      var afterFileResolved = function (downloadUrl, driveFileId) {
        payload.downloadUrl = downloadUrl;
        payload.driveFileId = driveFileId || '';
        gsRun('saveManual', APP.session.token, payload).then(function (res) {
          APP.content.isSubmitting = false;
          if (res.success) {
            closeManualForm();
            loadData(false);
            renderMainContent();
          } else {
            APP.content.manualFormError = res.error || 'No se pudo guardar.';
            renderModals();
          }
        }).catch(function (err) {
          APP.content.isSubmitting = false;
          APP.content.manualFormError = errorMessageOf_(err);
          renderModals();
        });
      };

      if (APP.content.manualUploadMode === 'file') {
        if (APP.content.pendingManualFile) {
          gsRun('uploadFileToDrive', APP.session.token, {
            filename: APP.content.pendingManualFile.filename,
            mimeType: APP.content.pendingManualFile.mimeType,
            base64Data: APP.content.pendingManualFile.base64Data,
            kind: payload.resourceType === 'Controlador' ? 'driver' : 'manual'
          }).then(function (fileInfo) {
            afterFileResolved(fileInfo.downloadUrl, fileInfo.fileId);
          }).catch(function (err) {
            APP.content.isSubmitting = false;
            APP.content.manualFormError = errorMessageOf_(err);
            renderModals();
          });
        } else if (m.id && m.downloadUrl) {
          afterFileResolved(m.downloadUrl, m.driveFileId);
        } else {
          APP.content.isSubmitting = false;
          APP.content.manualFormError = 'Selecciona un archivo para subir.';
          renderModals();
        }
      } else {
        var url = val('manualLinkInput').trim();
        if (!url) {
          APP.content.isSubmitting = false;
          APP.content.manualFormError = 'Pega un enlace de descarga.';
          renderModals();
          return;
        }
        if (url.indexOf('drive.google.com') !== -1) {
          gsRun('linkExistingDriveFile', APP.session.token, url).then(function (res) {
            if (res.success) {
              afterFileResolved(res.downloadUrl, res.fileId);
            } else {
              APP.content.isSubmitting = false;
              APP.content.manualFormError = res.error || 'No se pudo usar ese enlace.';
              renderModals();
            }
          }).catch(function (err) {
            APP.content.isSubmitting = false;
            APP.content.manualFormError = errorMessageOf_(err);
            renderModals();
          });
        } else {
          afterFileResolved(url, '');
        }
      }
    }

        } else if (v.id && v.driveFileId) {
          afterResolved(v.driveFileId, v.externalUrl);
        } else {
          APP.content.isSubmitting = false;
          APP.content.videoFormError = 'Selecciona un video para subir.';
          renderModals();
        }
      } else {
        var url = val('videoLinkInput').trim();
        if (!url) {
          APP.content.isSubmitting = false;
          APP.content.videoFormError = 'Pega un enlace de video.';
          renderModals();
          return;
        }
        if (url.indexOf('drive.google.com') !== -1) {
          gsRun('linkExistingDriveFile', APP.session.token, url).then(function (res) {
            if (res.success) {
              afterResolved(res.fileId, '');
            } else {
              APP.content.isSubmitting = false;
              APP.content.videoFormError = res.error || 'No se pudo usar ese enlace.';
              renderModals();
            }
          }).catch(function (err) {
            APP.content.isSubmitting = false;
            APP.content.videoFormError = errorMessageOf_(err);
            renderModals();
          });
        } else {
          afterResolved('', url);
        }
      }
    }

    }

    function toggleApiKeyVisibility() {
      var input = byId('settingsApiKey');
      var icon = byId('apiKeyEyeIcon');
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        if (icon) icon.setAttribute('data-lucide', 'eye');
      }
      refreshIcons();

    function submitSheetsForm(ev) {
      ev.preventDefault();
      var payload = {
        spreadsheetId: val('settingsSpreadsheetId'),
        sheetName: val('settingsSheetName'),
        range: val('settingsRange'),
        apiKey: val('settingsApiKey'),
        autoSyncEnabled: checked('settingsAutoSync')
      };
      gsRun('saveGoogleSheetsSettings', APP.session.token, payload).then(function (res) {
        if (res.success) {
          var msg = byId('sheetsSaveSuccessMsg');
          if (msg) { msg.classList.remove('hidden'); msg.classList.add('flex'); }
          setTimeout(function () { if (msg) { msg.classList.add('hidden'); msg.classList.remove('flex'); } }, 3000);
          loadData(false);
        } else {
          alert(res.error || 'No se pudo guardar la configuración.');
        }
      }).catch(function (err) { alert(errorMessageOf_(err)); });
    }

    function submitRulesForm(ev) {
      ev.preventDefault();
      var payload = {
        caseIdRegex: val('rulesCaseIdRegex'),
        minClientLength: Number(val('rulesMinClientLength')),
        allowSpecialCharsInClient: checked('rulesAllowSpecialChars'),
        requireModelSelection: checked('rulesRequireModel'),
        requireDescription: checked('rulesRequireDesc')
      };
      gsRun('saveValidationRules', APP.session.token, payload).then(function (res) {
        if (res.success) {
          var msg = byId('rulesSaveSuccessMsg');
          if (msg) { msg.classList.remove('hidden'); msg.classList.add('flex'); }
          setTimeout(function () { if (msg) { msg.classList.add('hidden'); msg.classList.remove('flex'); } }, 3000);
          loadData(false);

      }).catch(function (err) { alert(errorMessageOf_(err)); });
    }

              '<div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Nombre</label><input id="userFormName" type="text" value="' + esc(u.name || '') + '" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl py-2 px-3 text-sm"></div>' +
              (isNew ? '<div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Usuario</label><input id="userFormUsername" type="text" placeholder="usuario.tecnico" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl py-2 px-3 text-sm"></div>' : '') +
              '<div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Rol</label><select id="userFormRole" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl py-2 px-3 text-sm">' + roleOptions + '</select></div>' +
              '<div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Nivel (texto libre)</label><input id="userFormLevel" type="text" value="' + esc(u.level || '') + '" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl py-2 px-3 text-sm"></div>' +
              '<div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">' + (isNew ? 'Contraseña' : 'Restablecer contraseña (opcional)') + '</label><input id="userFormPassword" type="password" placeholder="' + (isNew ? '' : 'Dejar en blanco para no cambiarla') + '" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl py-2 px-3 text-sm"></div>' +
              '<div class="pt-3 border-t border-slate-800 flex justify-end gap-2">' +
                '<button type="button" onclick="closeUserForm()" class="px-4 py-2 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 cursor-pointer">Cancelar</button>' +
                '<button type="submit" ' + (APP.usersMgmt.isSubmitting ? 'disabled' : '') + ' class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-xl text-xs font-bold cursor-pointer disabled:opacity-55">Guardar</button>' +
              '</div>' +
            '</form>' +
          '</div>' +
        '</div>';
    }

    function submitUserForm(ev) {
      ev.preventDefault();
      var u = APP.usersMgmt.editingUser;
      var name = val('userFormName').trim();
      var role = val('userFormRole');
      var level = val('userFormLevel');
      var password = val('userFormPassword');

      APP.usersMgmt.isSubmitting = true;
      APP.usersMgmt.formError = '';
      renderModals();

      if (!u.id) {
        var username = val('userFormUsername').trim();
        if (!password) {
          APP.usersMgmt.isSubmitting = false;
          APP.usersMgmt.formError = 'La contraseña es obligatoria.';
          renderModals();
          return;
        }
        gsRun('adminCreateUser', APP.session.token, { name: name, username: username, password: password, role: role, level: level }).then(function (res) {
          APP.usersMgmt.isSubmitting = false;
          if (res.success) { closeUserForm(); loadData(false); renderMainContent(); }
          else { APP.usersMgmt.formError = res.error; renderModals(); }
        }).catch(function (err) { APP.usersMgmt.isSubmitting = false; APP.usersMgmt.formError = errorMessageOf_(err); renderModals(); });
      } else {
        var payload = { name: name, role: role, level: level };
        if (password) payload.newPassword = password;
        gsRun('adminUpdateUser', APP.session.token, u.id, payload).then(function (res) {
          APP.usersMgmt.isSubmitting = false;
          if (res.success) { closeUserForm(); loadData(false); renderMainContent(); }
          else { APP.usersMgmt.formError = res.error; renderModals(); }
        }).catch(function (err) { APP.usersMgmt.isSubmitting = false; APP.usersMgmt.formError = errorMessageOf_(err); renderModals(); });
      }
    }

    function confirmDeleteUser(id) {
      if (!confirm('¿Eliminar este usuario de forma permanente?')) return;
      gsRun('adminDeleteUser', APP.session.token, id).then(function (res) {
        if (!res.success) alert(res.error);
        loadData(false);
        renderMainContent();
      });
    }

    // -----------------------------------------------------------------------
    // Modals root
    // -----------------------------------------------------------------------
    function renderModals() {
      var root = byId('modals-root');
      if (!root) return;
      var html = '';
      if (APP.editingCase) html += caseModalHtml();
      if (APP.inspectingLogsCase) html += auditModalHtml();
      if (APP.training.selectedCourseId) html += courseModalHtml();
      if (APP.training.playingVideoId) html += videoPlayerModalHtml();
      if (APP.content.editingManual) html += manualFormModalHtml();
      if (APP.content.editingVideo) html += videoFormModalHtml();
      if (APP.usersMgmt.editingUser) html += userFormModalHtml();
      root.innerHTML = html;
      refreshIcons();
    }
  </script>
</body>
</html>
